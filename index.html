<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic Tac Toe</title>
  <style>
    :root {
      --background: #0f172a;
      --panel: rgba(30, 41, 59, 0.9);
      --cell: #1e293b;
      --cell-hover: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-two: #a78bfa;
      --win: #22c55e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #1e3a8a 0, var(--background) 48%);
    }

    .game {
      width: min(100%, 420px);
      padding: 32px 24px 24px;
      text-align: center;
      background: var(--panel);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 24px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(12px);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 8vw, 3rem);
      letter-spacing: -0.05em;
    }

    .subtitle { margin: 0 0 24px; color: var(--muted); }

    .status {
      min-height: 28px;
      margin-bottom: 18px;
      color: var(--accent);
      font-size: 1.1rem;
      font-weight: 700;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      aspect-ratio: 1;
    }

    .cell {
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 16px;
      color: var(--text);
      background: var(--cell);
      font-size: clamp(2.8rem, 16vw, 5rem);
      font-weight: 800;
      line-height: 1;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .cell:hover:not(:disabled) { transform: translateY(-3px); background: var(--cell-hover); }
    .cell:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .cell:disabled { cursor: default; }
    .cell.x { color: var(--accent); }
    .cell.o { color: var(--accent-two); }
    .cell.winner { color: var(--win); background: rgba(34, 197, 94, 0.16); }

    .controls { display: flex; justify-content: center; margin-top: 24px; }

    .reset {
      border: 0;
      border-radius: 999px;
      padding: 12px 22px;
      color: #082f49;
      background: var(--accent);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .reset:hover { filter: brightness(1.1); transform: translateY(-2px); }
    .reset:focus-visible { outline: 3px solid white; outline-offset: 3px; }
  </style>
</head>
<body>
  <main class="game" aria-labelledby="game-title">
    <h1 id="game-title">Tic Tac Toe</h1>
    <p class="subtitle">Get three in a row to win.</p>
    <div class="status" id="status" role="status" aria-live="polite">Player X's turn</div>

    <section class="board" id="board" aria-label="Tic tac toe board">
      <button class="cell" type="button" aria-label="Row 1, column 1"></button>
      <button class="cell" type="button" aria-label="Row 1, column 2"></button>
      <button class="cell" type="button" aria-label="Row 1, column 3"></button>
      <button class="cell" type="button" aria-label="Row 2, column 1"></button>
      <button class="cell" type="button" aria-label="Row 2, column 2"></button>
      <button class="cell" type="button" aria-label="Row 2, column 3"></button>
      <button class="cell" type="button" aria-label="Row 3, column 1"></button>
      <button class="cell" type="button" aria-label="Row 3, column 2"></button>
      <button class="cell" type="button" aria-label="Row 3, column 3"></button>
    </section>

    <div class="controls">
      <button class="reset" id="reset" type="button">New Game</button>
    </div>
  </main>

  <script>
    const cells = [...document.querySelectorAll('.cell')];
    const status = document.getElementById('status');
    const resetButton = document.getElementById('reset');
    const winningLines = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8],
      [0, 3, 6], [1, 4, 7], [2, 5, 8],
      [0, 4, 8], [2, 4, 6]
    ];

    let board = Array(9).fill('');
    let currentPlayer = 'X';
    let gameOver = false;

    function getWinningLine() {
      return winningLines.find(([a, b, c]) =>
        board[a] && board[a] === board[b] && board[a] === board[c]
      );
    }

    function render() {
      cells.forEach((cell, index) => {
        cell.textContent = board[index];
        cell.disabled = Boolean(board[index]) || gameOver;
        cell.classList.toggle('x', board[index] === 'X');
        cell.classList.toggle('o', board[index] === 'O');
        cell.setAttribute('aria-label', board[index]
          ? `Row ${Math.floor(index / 3) + 1}, column ${index % 3 + 1}: ${board[index]}`
          : `Row ${Math.floor(index / 3) + 1}, column ${index % 3 + 1}, empty`);
      });
    }

    function play(index) {
      if (board[index] || gameOver) return;
      board[index] = currentPlayer;
      const winningLine = getWinningLine();

      if (winningLine) {
        gameOver = true;
        winningLine.forEach((cellIndex) => cells[cellIndex].classList.add('winner'));
        status.textContent = `Player ${currentPlayer} wins!`;
      } else if (board.every(Boolean)) {
        gameOver = true;
        status.textContent = "It's a draw!";
      } else {
        currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
        status.textContent = `Player ${currentPlayer}'s turn`;
      }
      render();
    }

    function resetGame() {
      board = Array(9).fill('');
      currentPlayer = 'X';
      gameOver = false;
      cells.forEach((cell) => cell.classList.remove('winner'));
      status.textContent = "Player X's turn";
      render();
    }

    cells.forEach((cell, index) => cell.addEventListener('click', () => play(index)));
    resetButton.addEventListener('click', resetGame);
    render();
  </script>
</body>
</html>
